name: Docker Python maintenance
on:
  push:
    branches: [replacement-docker-python-01]
    paths: [.github/docker-maintenance-ready]
permissions:
  contents: read
concurrency:
  group: docker-python-maintenance
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'mohanad-hafez/ezsnmp-maintenance-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Update Docker Python versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/run_docker_update.py
      - name: Publish changes if needed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 0
          script: |
            const fs=require('node:fs');
            const result=JSON.parse(fs.readFileSync('docker-update-result.json'));
            const receipt={status:result.status==='noop'?'noop':'delivery_started'};
            const save=()=>fs.writeFileSync('docker-publication.json',JSON.stringify(receipt,null,2));save();
            if(result.status==='noop')return;
            if(!result.changes.length||result.changes.some(c=>!/^docker//.test(c.path)))throw Error('Unexpected native change paths');
            try{
              const parent=await github.rest.git.getCommit({...context.repo,commit_sha:context.sha});
              const tree=await github.rest.git.createTree({...context.repo,base_tree:parent.data.tree.sha,tree:result.changes.map(c=>({path:c.path,mode:'100644',type:'blob',content:c.content}))});
              const commit=await github.rest.git.createCommit({...context.repo,message:'chore(docker): update Python patch versions in Dockerfiles',tree:tree.data.sha,parents:[context.sha]});
              receipt.commit=commit.data.sha;save();
              await github.rest.git.createRef({...context.repo,ref:'refs/heads/automation/update-docker-python-versions',sha:commit.data.sha});
              receipt.branch_created=true;save();
              const pr=await github.rest.pulls.create({...context.repo,title:'[docker-python-update] Update Docker Python patch versions',head:'automation/update-docker-python-versions',base:'replacement-docker-python-01',body:'Updates Docker Python patch versions using the repository updater. Includes Dockerfiles, cache script and Docker documentation when changed. Generated by this workflow.'});
              receipt.pr={number:pr.data.number,url:pr.data.html_url};receipt.status='published';save();
              await github.rest.issues.addLabels({...context.repo,issue_number:pr.data.number,labels:['dependencies','docker','automated-pr']});
            }catch(e){receipt.status='delivery_uncertain';receipt.error={message:e.message,status:e.status};save();throw e}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: docker-maintenance
          path: |
            docker-input-capture.json
            docker-update-result.json
            docker-publication.json
          retention-days: 14
